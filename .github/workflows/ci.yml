# CliQ. CI: tests and builds only. It never deploys; production deploys are
# a manual, approved step (docs/railway.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The suite runs per folder (one process for everything needs too much memory).
        folder:
          - tests/orders
          - tests/catalogue
          - tests/payments tests/coupons tests/pricing tests/cart
          - tests/brands tests/core tests/tenants tests/auth tests/account
          - tests/admin tests/ai tests/dashboard tests/gst_defaults tests/ratings tests/search_filter tests/shipments tests/wishlist
    steps:
      - uses: actions/checkout@v4
      - name: Build the test image
        run: docker build -t tws-ecommerce-core-api backend
      - name: Migration history is linear and matches the models
        if: matrix.folder == 'tests/brands tests/core tests/tenants tests/auth tests/account'
        run: backend/scripts/test.sh tests/core/test_migration_history.py tests/core/test_migrate_command.py -q
      - name: Tests (throwaway Postgres, Redis and MinIO)
        run: backend/scripts/test.sh ${{ matrix.folder }} -q

  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: storefront-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: storefront-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_PLATFORM_ROOT_DOMAIN: example.com
